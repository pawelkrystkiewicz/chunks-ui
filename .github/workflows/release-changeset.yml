name: Release

on:
  push:
    branches:
      - master
  # A run by hand at master HEAD (the job skips other branches); see TESTING_STRATEGY.md, CI, Release
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    # An npm publish cannot be undone: a manual run from another branch must not reach it
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    env:
      NPM_CONFIG_PROVENANCE: true
    steps:
      - name: Checkout Repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      # changeset publish runs npm publish with trusted publishing (OIDC, no NPM_TOKEN), which
      # needs npm 11.5.1 or newer: an older npm has no token and fails after the build.
      - name: Check npm supports trusted publishing
        run: |
          need=11.5.1
          have=$(npm --version)
          if [ "$(printf '%s\n' "$need" "$have" | sort -V | head -n1)" != "$need" ]; then
            echo "npm $have cannot publish with trusted publishing; $need or newer is needed"
            exit 1
          fi

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          publish: bun run release
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
          # NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          # NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Notify Slack on Release Success
        if: steps.changesets.outputs.published == 'true'
        uses: slackapi/slack-github-action@91efab103c0de0a537f72a35f6b8cda0ee76bf0a # v2.1.1
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: "${{ secrets.SLACK_CHANNEL_ID }}"
            text: "Published ${{ fromJSON(steps.changesets.outputs.publishedPackages)[0].name }}@${{ fromJSON(steps.changesets.outputs.publishedPackages)[0].version }} to npm\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View workflow>"

      # Nothing published: a run that refreshed the Version Packages PR, a run where master holds
      # only empty changesets (the action logs "All changesets are empty; not creating PR" and skips
      # the publish; hasChangesets is 'true' in both runs, so it cannot tell them apart), or a
      # publish that found the version on npm already. Master's package.json is at a published
      # version in all but the second case, so npm decides whether a message goes out.
      - name: Check npm has the version master is at
        id: unpublished
        if: steps.changesets.outputs.published != 'true'
        run: |
          version=$(node -p "require('./packages/ui/package.json').version")
          if npm view "chunks-ui@$version" version >/dev/null; then
            echo "chunks-ui@$version is on npm"
          else
            echo "chunks-ui@$version is not on npm"
            echo "version=$version" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify Slack when the run published nothing and npm lacks the version
        if: steps.unpublished.outputs.version != ''
        uses: slackapi/slack-github-action@91efab103c0de0a537f72a35f6b8cda0ee76bf0a # v2.1.1
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: "${{ secrets.SLACK_CHANNEL_ID }}"
            text: "Release run published nothing but chunks-ui@${{ steps.unpublished.outputs.version }} is not on npm; master holds only empty changesets or the publish was skipped\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View workflow>"

      - name: Notify Slack on Release Failure
        if: failure()
        uses: slackapi/slack-github-action@91efab103c0de0a537f72a35f6b8cda0ee76bf0a # v2.1.1
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: "${{ secrets.SLACK_CHANNEL_ID }}"
            text: "Release workflow failed\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View workflow>"
