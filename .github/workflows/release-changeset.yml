name: Release

on:
  push:
    branches:
      - master
  # A run by hand at master HEAD (the job skips other branches); see TESTING_STRATEGY.md, CI, Release
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    # An npm publish cannot be undone: a manual run from another branch must not reach it
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    env:
      NPM_CONFIG_PROVENANCE: true
    steps:
      - name: Checkout Repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      # changeset publish runs npm publish with trusted publishing (OIDC, no NPM_TOKEN), which
      # needs npm 11.5.1 or newer: an older npm has no token and fails after the build.
      - name: Check npm supports trusted publishing
        run: |
          need=11.5.1
          have=$(npm --version)
          if [ "$(printf '%s\n' "$need" "$have" | sort -V | head -n1)" != "$need" ]; then
            echo "npm $have cannot publish with trusted publishing; $need or newer is needed"
            exit 1
          fi

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          publish: bun run release
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
          # NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          # NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Notify Slack on Release Success
        if: steps.changesets.outputs.published == 'true'
        uses: slackapi/slack-github-action@91efab103c0de0a537f72a35f6b8cda0ee76bf0a # v2.1.1
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: "${{ secrets.SLACK_CHANNEL_ID }}"
            text: "Published ${{ fromJSON(steps.changesets.outputs.publishedPackages)[0].name }}@${{ fromJSON(steps.changesets.outputs.publishedPackages)[0].version }} to npm\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View workflow>"

      # Nothing published: a run that refreshed the Version Packages PR, a run where master holds
      # only empty changesets (the action logs "All changesets are empty; not creating PR"), or a
      # publish that found the version on npm already. The action publishes only when no changeset
      # is left on master, and hasChangesets is 'true' for empty ones too, so only that log line
      # tells the first two apart. The version at the run's commit is a published one in all of
      # these unless a Version Packages PR was merged before the Release run of the newest master
      # push had refreshed it: master then sits at the bumped, unpublished version with the
      # changesets the PR did not consume, empty or real, and no run publishes until they are gone.
      # Empty: delete them in a PR and the next run publishes. Real: that run refreshed the Version
      # Packages PR, but the version the message names is never published: `changeset version`
      # bumps again from it and `changeset publish` publishes only the version in package.json.
      # Merging the PR publishes the next version; npm skips the stale one, CHANGELOG.md keeps its
      # section, and it gets no tag or GitHub release. The message repeats on each master push
      # until then. npm decides whether a message goes out: only an E404 for the version does (any
      # other npm failure is a warning).
      - name: Check npm has the version master is at
        id: unpublished
        if: steps.changesets.outputs.published != 'true'
        run: |
          # Not the workspace: changesets/action leaves it on its release branch, versions bumped
          version=$(git show "$GITHUB_SHA:packages/ui/package.json" | jq -r .version)
          if out=$(npm view "chunks-ui@$version" version 2>&1); then
            echo "chunks-ui@$version is on npm"
          elif grep -q E404 <<<"$out"; then
            echo "chunks-ui@$version is not on npm"
            echo "version=$version" >> "$GITHUB_OUTPUT"
          else
            echo "$out"
            echo "::warning::npm view failed: ${out//$'\n'/%0A}"
          fi

      - name: Notify Slack when the run published nothing and npm lacks the version
        if: steps.unpublished.outputs.version != ''
        uses: slackapi/slack-github-action@91efab103c0de0a537f72a35f6b8cda0ee76bf0a # v2.1.1
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: "${{ secrets.SLACK_CHANNEL_ID }}"
            text: "Release run published nothing but chunks-ui@${{ steps.unpublished.outputs.version }} is not on npm; a Version Packages PR was merged too early and master still holds changesets (TESTING_STRATEGY.md, CI, Release)\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View workflow>"

      - name: Notify Slack on Release Failure
        if: failure()
        uses: slackapi/slack-github-action@91efab103c0de0a537f72a35f6b8cda0ee76bf0a # v2.1.1
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: "${{ secrets.SLACK_CHANNEL_ID }}"
            text: "Release workflow failed\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View workflow>"
