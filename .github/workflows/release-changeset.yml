name: Release

on:
  push:
    branches:
      - master
  # A run by hand at master HEAD (the job skips other branches); see TESTING_STRATEGY.md, CI, Release
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    # An npm publish cannot be undone: a manual run from another branch must not reach it
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    env:
      NPM_CONFIG_PROVENANCE: true
    # Read by the design-system job below
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      packages: ${{ steps.changesets.outputs.published-packages }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      # changeset publish runs npm publish with trusted publishing (OIDC, no NPM_TOKEN), which
      # needs npm 11.5.1 or newer: an older npm has no token and fails after the build.
      - name: Check npm supports trusted publishing
        run: |
          need=11.5.1
          have=$(npm --version)
          if [ "$(printf '%s\n' "$need" "$have" | sort -V | head -n1)" != "$need" ]; then
            echo "npm $have cannot publish with trusted publishing; $need or newer is needed"
            exit 1
          fi

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ secrets.PAT_TOKEN }}
          publish-script: bun run release
          # changeset version alone leaves the packages/ui version in bun.lock stale
          version-script: bun run version-packages
          # GitHub caps a release body at 125000 characters and the action (v2.1.2 too) sends the
          # entry untruncated; "Create GitHub release" below makes the tag and the release instead.
          create-github-releases: false
          # Since v2 the action pushes the tag even without a release; gh release create makes it
          push-git-tags: false

      - name: Notify Slack on Release Success
        if: steps.changesets.outputs.published == 'true'
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: "${{ secrets.SLACK_CHANNEL_ID }}"
            text: "Published ${{ fromJSON(steps.changesets.outputs.published-packages)[0].name }}@${{ fromJSON(steps.changesets.outputs.published-packages)[0].version }} to npm\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View workflow>"

      # After the Slack ping, so the publish is reported even when this fails. gh makes the tag
      # at the run commit on GitHub's side; the action no longer pushes it.
      - name: Create GitHub release
        if: ${{ !cancelled() && steps.changesets.outputs.published == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          VERSION: ${{ fromJSON(steps.changesets.outputs.published-packages)[0].version }}
        run: |
          set -o pipefail
          tag="chunks-ui@$VERSION"
          notes="$RUNNER_TEMP/release-notes.md"
          # Read at the run's commit, which the tag points at, not from the workspace
          git show "$GITHUB_SHA:packages/ui/CHANGELOG.md" |
            awk -v h="## $VERSION" '/^## / { on = ($0 == h); next } on' > "$notes"
          if ! grep -q '[^[:space:]]' "$notes"; then
            echo "::error::packages/ui/CHANGELOG.md at $GITHUB_SHA has no '## $VERSION' entry"
            exit 1
          fi
          # wc -c counts bytes, never fewer than characters, so this errs on the safe side of the cap
          if [ "$(wc -c < "$notes")" -gt 125000 ]; then
            echo "These notes are longer than a GitHub release allows: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$tag/packages/ui/CHANGELOG.md#${VERSION//./}" > "$notes"
          fi
          pre=()
          if [[ $VERSION == *-* ]]; then pre=(--prerelease); fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes-file "$notes" "${pre[@]}"

      # Nothing published: when this fires and what to do are in TESTING_STRATEGY.md, CI, Release.
      - name: Check npm has the version master is at
        id: unpublished
        if: steps.changesets.outputs.published != 'true'
        run: |
          # An empty or null version must fail here, not reach npm view; `|| version=` keeps bash -e alive to print the ::error::.
          set -o pipefail
          # Not the workspace: changesets/action leaves it on its release branch, versions bumped
          version=$(git show "$GITHUB_SHA:packages/ui/package.json" | jq -r .version) || version=
          if [ -z "$version" ] || [ "$version" = null ]; then
            echo "::error::cannot read .version of packages/ui/package.json at $GITHUB_SHA"
            exit 1
          fi
          if out=$(npm view "chunks-ui@$version" version 2>&1); then
            echo "chunks-ui@$version is on npm"
          elif grep -q E404 <<<"$out"; then
            echo "chunks-ui@$version is not on npm"
            echo "version=$version" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::npm view failed: ${out//$'\n'/%0A}"
          fi

      - name: Notify Slack when the run published nothing and npm lacks the version
        if: steps.unpublished.outputs.version != ''
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: "${{ secrets.SLACK_CHANNEL_ID }}"
            text: "Release run published nothing but chunks-ui@${{ steps.unpublished.outputs.version }} is not on npm; a Version Packages PR was merged too early and master still holds changesets (TESTING_STRATEGY.md, CI, Release)\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View workflow>"

      - name: Notify Slack on Release Failure
        if: failure()
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: "${{ secrets.SLACK_CHANNEL_ID }}"
            text: "Release workflow failed\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View workflow>"

  # The files of the Chunks UI design system (a claude.ai artifact; scripts/design-system/README.md),
  # built at the released commit and attached to its GitHub release. A job of its own after the
  # release, so a failure here never touches the npm publish. CI cannot publish to an artifact:
  # each user's Claude imports the tarball (apps/docs/content/claude-design-system.mdx).
  design-system:
    name: Design system
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Build the design system
        run: bun run design-system

      # Users run the tarball's merge.mts with their own Node, not Bun: a first import, into an empty folder
      - name: Check the shipped merge script runs on Node
        run: |
          mkdir "$RUNNER_TEMP/empty"
          node .design-system/out/merge.mts --live "$RUNNER_TEMP/empty" --out "$RUNNER_TEMP/merge"

      - name: Attach it to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ fromJSON(needs.release.outputs.packages)[0].version }}
        run: |
          tar -czf "$RUNNER_TEMP/design-system.tgz" -C .design-system out
          gh release upload "chunks-ui@$VERSION" "$RUNNER_TEMP/design-system.tgz" --clobber --repo "$GITHUB_REPOSITORY"

      - name: Notify Slack on Design system failure
        if: failure()
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: "${{ secrets.SLACK_CHANNEL_ID }}"
            text: "Design system job failed: the chunks-ui@${{ fromJSON(needs.release.outputs.packages)[0].version }} release has no design-system.tgz, so the docs' download link fails until \"Re-run failed jobs\" (TESTING_STRATEGY.md, CI, Design system)\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View workflow>"
