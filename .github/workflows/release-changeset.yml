name: Release

on:
  push:
    branches:
      - master
  # A run by hand at master HEAD (the job skips other branches); see TESTING_STRATEGY.md, CI, Release
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    # An npm publish cannot be undone: a manual run from another branch must not reach it
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    env:
      NPM_CONFIG_PROVENANCE: true
    steps:
      - name: Checkout Repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      # changeset publish runs npm publish with trusted publishing (OIDC, no NPM_TOKEN), which
      # needs npm 11.5.1 or newer: an older npm has no token and fails after the build.
      - name: Check npm supports trusted publishing
        run: |
          need=11.5.1
          have=$(npm --version)
          if [ "$(printf '%s\n' "$need" "$have" | sort -V | head -n1)" != "$need" ]; then
            echo "npm $have cannot publish with trusted publishing; $need or newer is needed"
            exit 1
          fi

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          publish: bun run release
          # changeset version alone leaves the packages/ui version in bun.lock stale
          version: bun run version-packages
          # GitHub caps a release body at 125000 characters and the action (v2.1.2 too) sends the
          # entry untruncated; "Create GitHub release" below makes the tag and the release instead.
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
          # NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          # NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # The Slack text names every package the run published; an expression cannot join name@version
      - name: Name the published packages
        id: published
        if: steps.changesets.outputs.published == 'true'
        env:
          PUBLISHED: ${{ steps.changesets.outputs.publishedPackages }}
        run: |
          # Assigned first: a jq failure inside echo's argument would not stop the step
          list=$(jq -r 'map(.name + "@" + .version) | join(", ")' <<<"$PUBLISHED")
          echo "list=$list" >> "$GITHUB_OUTPUT"

      - name: Notify Slack on Release Success
        if: steps.changesets.outputs.published == 'true'
        uses: slackapi/slack-github-action@91efab103c0de0a537f72a35f6b8cda0ee76bf0a # v2.1.1
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: "${{ secrets.SLACK_CHANNEL_ID }}"
            text: "Published ${{ steps.published.outputs.list }} to npm\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View workflow>"

      # After the Slack ping, so the publish is reported even when this fails. gh makes the tag
      # at the run commit on GitHub's side; the action no longer pushes it. The release is
      # chunks-ui's alone: a run that published only chunks-ui-core makes none.
      - name: Create GitHub release
        if: ${{ !cancelled() && steps.changesets.outputs.published == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          PUBLISHED: ${{ steps.changesets.outputs.publishedPackages }}
        run: |
          set -o pipefail
          VERSION=$(jq -r '.[] | select(.name == "chunks-ui") | .version' <<<"$PUBLISHED")
          if [ -z "$VERSION" ]; then
            echo "chunks-ui was not published in this run, so there is no release to create"
            exit 0
          fi
          tag="chunks-ui@$VERSION"
          notes="$RUNNER_TEMP/release-notes.md"
          # Read at the run's commit, which the tag points at, not from the workspace
          git show "$GITHUB_SHA:packages/ui/CHANGELOG.md" |
            awk -v h="## $VERSION" '/^## / { on = ($0 == h); next } on' > "$notes"
          if ! grep -q '[^[:space:]]' "$notes"; then
            echo "::error::packages/ui/CHANGELOG.md at $GITHUB_SHA has no '## $VERSION' entry"
            exit 1
          fi
          # wc -c counts bytes, never fewer than characters, so this errs on the safe side of the cap
          if [ "$(wc -c < "$notes")" -gt 125000 ]; then
            echo "These notes are longer than a GitHub release allows: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$tag/packages/ui/CHANGELOG.md#${VERSION//./}" > "$notes"
          fi
          pre=()
          if [[ $VERSION == *-* ]]; then pre=(--prerelease); fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes-file "$notes" "${pre[@]}"

      # Nothing published: when this fires and what to do are in TESTING_STRATEGY.md, CI, Release.
      - name: Check npm has the version master is at
        id: unpublished
        if: steps.changesets.outputs.published != 'true'
        run: |
          # An empty or null version must fail here, not reach npm view; `|| version=` keeps bash -e alive to print the ::error::.
          set -o pipefail
          # Not the workspace: changesets/action leaves it on its release branch, versions bumped
          version=$(git show "$GITHUB_SHA:packages/ui/package.json" | jq -r .version) || version=
          if [ -z "$version" ] || [ "$version" = null ]; then
            echo "::error::cannot read .version of packages/ui/package.json at $GITHUB_SHA"
            exit 1
          fi
          if out=$(npm view "chunks-ui@$version" version 2>&1); then
            echo "chunks-ui@$version is on npm"
          elif grep -q E404 <<<"$out"; then
            echo "chunks-ui@$version is not on npm"
            echo "version=$version" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::npm view failed: ${out//$'\n'/%0A}"
          fi

      - name: Notify Slack when the run published nothing and npm lacks the version
        if: steps.unpublished.outputs.version != ''
        uses: slackapi/slack-github-action@91efab103c0de0a537f72a35f6b8cda0ee76bf0a # v2.1.1
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: "${{ secrets.SLACK_CHANNEL_ID }}"
            text: "Release run published nothing but chunks-ui@${{ steps.unpublished.outputs.version }} is not on npm; a Version Packages PR was merged too early and master still holds changesets (TESTING_STRATEGY.md, CI, Release)\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View workflow>"

      - name: Notify Slack on Release Failure
        if: failure()
        uses: slackapi/slack-github-action@91efab103c0de0a537f72a35f6b8cda0ee76bf0a # v2.1.1
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: "${{ secrets.SLACK_CHANNEL_ID }}"
            text: "Release workflow failed\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View workflow>"
