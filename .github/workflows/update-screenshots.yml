name: Update Visual Regression Screenshots

on:
  workflow_dispatch: # manual trigger only

env:
  AUTHOR_NAME: 'github-actions[bot]'
  AUTHOR_EMAIL: '41898282+github-actions[bot]@users.noreply.github.com'
  COMMIT_MESSAGE: |
    test: update visual regression screenshots

jobs:
  update-screenshots:
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    # Same image as the local linux/amd64 recipe; check:playwright keeps the tag equal to @playwright/test.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea

    # safety first: don't run on main
    if: github.ref_name != github.event.repository.default_branch

    # one at a time per branch
    concurrency:
      group: visual-regression-screenshots@${{ github.ref_name }}
      cancel-in-progress: true

    permissions:
      contents: write # needs to push changes

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false

      - name: Configure Git
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global user.name "$AUTHOR_NAME"
          git config --global user.email "$AUTHOR_EMAIL"

      # setup-bun needs unzip; the image lacks it
      - name: Install unzip
        run: apt-get update && apt-get install -y --no-install-recommends unzip

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      # bun install cache (container HOME)
      - name: Cache the bun install cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-container-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-container-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Update Visual Regression Screenshots
        run: cd packages/ui && bun run test:visual:update

      # Stage first: git detects a rename only in the index, and --name-only then prints the new
      # path alone. -z leaves spaces and non-ASCII unquoted (git status --porcelain quotes them).
      - name: Check for changes
        id: check_changes
        run: |
          git add -A
          CHANGED_FILES=$(git diff --cached --name-only -z | tr '\0' '\n')
          if [ "${CHANGED_FILES:+x}" ]; then
            echo "changes=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected"

            # save the list for the summary; random delimiter so a file named EOF cannot end the block early
            delim="EOF_$(od -An -tx1 -N8 /dev/urandom | tr -d ' \n')"
            {
              echo "changed_files<<$delim"
              printf '%s\n' "$CHANGED_FILES"
              echo "$delim"
              echo "changed_count=$(printf '%s\n' "$CHANGED_FILES" | wc -l)"
            } >> "$GITHUB_OUTPUT"
          else
            echo "changes=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected"
          fi

      # commit if there are changes
      - name: Commit changes
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git add -A
          git commit -m "$COMMIT_MESSAGE"
        env:
          COMMIT_MESSAGE: ${{ env.COMMIT_MESSAGE }}

      - name: Push changes
        id: push_changes
        if: steps.check_changes.outputs.changes == 'true'
        env:
          REF_NAME: ${{ github.ref_name }}
          GH_PAT: ${{ secrets.PAT_TOKEN }}
          REPO: ${{ github.repository }}
        run: git push "https://x-access-token:${GH_PAT}@github.com/${REPO}.git" "HEAD:${REF_NAME}"

      # pretty summary for humans: "pushed" only on a successful push; an empty CHANGES means an
      # earlier step failed or the run was cancelled, not "up to date"
      - name: Summary
        if: always()
        run: |
          if [ "$CHANGES" = true ] && [ "$PUSH_OUTCOME" = success ]; then
            {
              echo "### Visual Regression Screenshots Updated"
              echo ""
              echo "Successfully updated **${CHANGED_COUNT}** screenshot(s) on \`${BRANCH}\`"
              echo ""
              echo "#### Changed Files:"
              echo "\`\`\`"
              printf '%s\n' "$CHANGED_FILES"
              echo "\`\`\`"
              echo ""
              echo "The updated screenshots have been committed and pushed. Your visual regression baseline is now up to date."
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ "$CHANGES" = true ]; then
            {
              echo "### Visual Regression Screenshots Not Pushed"
              echo ""
              echo "**${CHANGED_COUNT}** screenshot(s) changed, but the push to \`${BRANCH}\` did not succeed (outcome: \`${PUSH_OUTCOME:-unknown}\`), so this run's commit is discarded. See the Commit changes and Push changes logs."
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ "$CHANGES" = false ]; then
            {
              echo "### No Screenshot Updates Required"
              echo ""
              echo "All screenshots are already up to date."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Screenshot Update Did Not Finish"
              echo ""
              echo "The run stopped before changes were checked (an earlier step failed or the run was cancelled). See the earlier steps' logs."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
        env:
          CHANGES: ${{ steps.check_changes.outputs.changes }}
          PUSH_OUTCOME: ${{ steps.push_changes.outcome }}
          CHANGED_COUNT: ${{ steps.check_changes.outputs.changed_count }}
          CHANGED_FILES: ${{ steps.check_changes.outputs.changed_files }}
          BRANCH: ${{ github.ref_name }}
