name: Quality Gates
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
# A newer push to the same PR cancels this run; master pushes and manual runs never share a group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
env:
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8
jobs:
  lint:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Check the Playwright version matches everywhere
        run: bun run check:playwright

  typecheck:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Includes the docs snippet type-check (apps/docs check:snippets)
      - name: Typecheck
        run: bun run check-types

      # check-types builds chunks-ui, so the build here is a turbo cache hit. The Tailwind 4.0
      # install is pinned by scripts/tailwind-4.0 (frozen lockfile); bun.lock stays as it is
      - name: Check Tailwind 4.0 generates every class
        run: bun run check:tailwind

  docs-build:
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    # issues: read lets check:a11y read the state of the issues its ALLOWED entries link
    permissions:
      contents: read
      issues: read
    # The axe check drives Chromium; this image has the browser for the pinned playwright.
    # Same image as the visual tests; check:playwright keeps the tag equal to apps/docs' playwright.
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f
    steps:
      - name: Checkout Repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # setup-bun needs unzip; the image lacks it
      - name: Install unzip
        run: apt-get update && apt-get install -y --no-install-recommends unzip

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build docs
        run: bun run build --filter=@chunks-ui/docs

      # The docs build built chunks-ui: check its typings per format (attw) and its dist/ layout
      - name: Check chunks-ui package
        working-directory: packages/ui
        run: bun run check:exports && bun run check:dist

      # Run from apps/docs, not through Turbo: its strict env mode drops PLAYWRIGHT_BROWSERS_PATH
      - name: Check docs pages with axe
        working-directory: apps/docs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun run check:a11y
