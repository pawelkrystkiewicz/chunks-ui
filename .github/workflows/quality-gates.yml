name: Quality Gates
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
# A newer push to the same PR cancels this run; master pushes never share a group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
env:
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8
jobs:
  lint:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the changeset check below diffs against the merge base with origin/master
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      # bun install reads package tarballs from here; a hit saves the registry downloads
      - name: Cache the bun install cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-host-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-host-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Runs before Lint so a lint failure does not hide it. Skipped on the release branch (it has
      # no changesets) and on Renovate branches (Renovate cannot write one)
      - name: Check changed packages have a changeset
        if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/master' && !startsWith(github.head_ref, 'renovate/')
        run: bunx changeset status --since=origin/master

      - name: Lint
        run: bun run lint

      # Turbo's lint covers the workspaces only, not the root scripts/
      - name: Lint the root scripts
        run: bun run lint:scripts

      - name: Check the Playwright version matches everywhere
        run: bun run check:playwright

      - name: Check the bun version matches packageManager everywhere
        run: bun run check:bun

      - name: Check the docs use logical direction classes
        run: bun run check:docs-direction

  typecheck:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      # bun install cache
      - name: Cache the bun install cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-host-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-host-

      # Turbo's cache: a hit replays the chunks-ui build. Turbo never evicts, so the last step
      # drops entries older than a week
      - name: Cache the Turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-typecheck-${{ hashFiles('bun.lock', 'turbo.json', 'packages/ui/src/**', 'packages/ui/tsup.config.ts', 'packages/ui/package.json') }}
          restore-keys: ${{ runner.os }}-turbo-typecheck-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Includes the docs snippet type-check (apps/docs check:snippets) and the props tables drift
      # check (apps/docs check:props)
      - name: Typecheck
        run: bun run check-types

      # Turbo's check-types covers the workspaces only, not the root scripts/
      - name: Typecheck the root scripts
        run: bun run check-types:scripts

      # check-types builds chunks-ui, so the build here is a turbo cache hit. The Tailwind 4.0
      # install is pinned by scripts/tailwind-4.0 (frozen lockfile); bun.lock stays as it is
      - name: Check Tailwind 4.0 generates every class
        run: bun run check:tailwind

      - name: Prune old Turbo cache entries
        if: always()
        run: find .turbo/cache -type f -mtime +7 -delete || true

  docs-build:
    timeout-minutes: 20
    runs-on: ubuntu-26.04
    # issues: read lets check:a11y read the state of the issues its ALLOWED entries link
    permissions:
      contents: read
      issues: read
    # The axe check and check:no-motion drive Chromium; this image has the browser for the pinned playwright.
    # Same image as the visual tests; check:playwright keeps the tag equal to the docs' and the root's playwright.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # setup-bun needs unzip; the image lacks it
      - name: Install unzip
        run: apt-get update && apt-get install -y --no-install-recommends unzip

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      # bun install cache (container HOME)
      - name: Cache the bun install cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-container-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-container-

      # Next's compiler cache. Before bun install, so the source globs see no node_modules. A source
      # change restores the newest cache for the same bun.lock, and the build reuses what it can
      - name: Cache the Next.js cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/docs/.next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('bun.lock') }}-${{ hashFiles('apps/docs/**/*.ts', 'apps/docs/**/*.tsx', 'apps/docs/**/*.mdx', 'apps/docs/**/*.css') }}
          restore-keys: ${{ runner.os }}-next-${{ hashFiles('bun.lock') }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build docs
        run: bun run build --filter=@chunks-ui/docs

      # The docs build built chunks-ui: check its typings per format (attw) and its dist/ layout
      - name: Check chunks-ui package
        working-directory: packages/ui
        run: bun run check:exports && bun run check:dist

      # Builds consumers with and without Motion with webpack and with Turbopack (next build), then
      # opens each export in this image's Chromium; the turbo build is a cache hit and the installs
      # are pinned by scripts/no-motion, so it needs the network and the browser only
      - name: Check optional Motion (webpack, Turbopack and Chromium)
        run: bun run check:no-motion

      # Run from apps/docs, not through Turbo: its strict env mode drops PLAYWRIGHT_BROWSERS_PATH
      - name: Check docs pages with axe
        working-directory: apps/docs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun run check:a11y
