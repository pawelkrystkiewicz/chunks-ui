name: Unit Tests
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
  pull-requests: write
# A newer push to the same PR cancels this run; master pushes never share a group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
env:
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The design-system merge spec runs the shipped merge script with Node (bun test ./scripts)
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      # bun install cache
      - name: Cache the bun install cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-host-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-host-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # One task at a time: the docs and ui jsdom suites slow each other down on 4 vCPUs.
      # --continue: a failing ui suite still runs the docs tests; the step still fails
      - name: Run tests and generate coverage report
        run: bun run test:unit:coverage --concurrency=1 --continue=dependencies-successful

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-report
          path: packages/ui/coverage

      - name: Vitest Coverage Report
        uses: davelosert/vitest-coverage-report-action@8f86cfb56ed6d5613ea8cdc5259f207fbfd51ece # v2.13.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: packages/ui

      - name: Test the repo scripts
        if: ${{ !cancelled() }}
        run: bun test ./scripts ./packages/ui/scripts

  # The ui unit suite at the lowest versions the peer ranges allow. Informational until it has
  # three stable runs, then it becomes required (#393).
  floors:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    # It runs code bun.lock does not pin (react-dom@19.2.0 pulls scheduler@0.27.0 from the
    # registry), so it gets no write scope
    permissions:
      contents: read
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      # Restore only: the install below changes bun.lock, so the cache must never be saved from it
      - name: Restore the bun install cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-host-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-host-

      # Not --frozen-lockfile: the overrides change bun.lock. The edit stays in this throwaway
      # checkout, which nothing commits or caches.
      - name: Install the peer floors
        run: |
          bun scripts/check-peer-floors.ts --overrides
          bun install

      - name: Check what chunks-ui resolves
        run: bun scripts/check-peer-floors.ts

      - name: Type-check chunks-ui at the floors
        run: bun run --cwd packages/ui check-types

      - name: Run the ui unit tests at the floors
        run: bun run --cwd packages/ui test
