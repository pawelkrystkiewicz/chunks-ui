name: Unit Tests
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
  pull-requests: write
# A newer push to the same PR cancels this run; master pushes and manual runs never share a group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
env:
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests and generate coverage report
        run: bun run test:unit:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report
          path: packages/ui/coverage

      - name: Vitest Coverage Report
        uses: davelosert/vitest-coverage-report-action@c4bbc33a89b7ace0e63d35f1f7d4bcee31155a73 # v2.13.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: packages/ui
