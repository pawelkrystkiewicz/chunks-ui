name: Unit Tests
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
  pull-requests: write
# A newer push to the same PR cancels this run; master pushes never share a group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
env:
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      # bun install cache
      - name: Cache the bun install cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-host-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-host-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # One task at a time: the docs and ui jsdom suites slow each other down on 4 vCPUs.
      # --continue: a failing ui suite still runs the docs tests; the step still fails
      - name: Run tests and generate coverage report
        run: bun run test:unit:coverage --concurrency=1 --continue=dependencies-successful

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-report
          path: packages/ui/coverage

      - name: Vitest Coverage Report
        uses: davelosert/vitest-coverage-report-action@c4bbc33a89b7ace0e63d35f1f7d4bcee31155a73 # v2.13.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: packages/ui

      # The root scripts and the packages/ui build check (check-dist.spec.ts): the ui `test`
      # script runs the second only in the floors job, which is not required
      - name: Test the repo scripts
        if: ${{ !cancelled() }}
        run: bun test ./scripts ./packages/ui/scripts

  # The ui unit suite at the lowest versions the peer ranges allow. Informational until it has
  # three stable runs, then it becomes required (#393).
  floors:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    # It runs code bun.lock does not pin (react-dom@19.2.0 pulls scheduler@0.27.0 from the
    # registry), so it gets no write scope
    permissions:
      contents: read
    steps:
      - name: Checkout Repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      # Restore only: the install below changes bun.lock, so the cache must never be saved from it
      - name: Restore the bun install cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-host-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-host-

      # The floors go in as `overrides` in the root package.json, so bun resolves every dependent
      # of the peers at them: packages/ui's own devDependencies (motion, @types/react,
      # @types/react-dom, @base-ui/react) and the peer links of the rest, one copy of each, with
      # no node_modules surgery. The types are floored at the <major>.<minor> of the react and
      # react-dom floors. Not --frozen-lockfile: the overrides change bun.lock. The edit and the
      # new lockfile stay in this throwaway checkout, which nothing commits or caches. The check
      # step proves what resolves.
      - name: Install the peer floors
        run: |
          bun scripts/check-peer-floors.ts --overrides
          bun install

      - name: Check what chunks-ui resolves
        run: bun scripts/check-peer-floors.ts

      - name: Type-check chunks-ui at the floors
        run: bun run --cwd packages/ui check-types

      - name: Run the ui unit tests at the floors
        run: bun run --cwd packages/ui test
