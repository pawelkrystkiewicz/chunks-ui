name: Unit Tests
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
  pull-requests: write
# A newer push to the same PR cancels this run; master pushes and manual runs never share a group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
env:
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      # bun install cache
      - name: Cache the bun install cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-host-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-host-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # One task at a time: the docs and ui jsdom suites slow each other down on 4 vCPUs.
      # --continue: a failing ui suite still runs the docs tests; the step still fails
      - name: Run tests and generate coverage report
        run: bun run test:unit:coverage --concurrency=1 --continue=dependencies-successful

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-report
          path: packages/ui/coverage

      - name: Vitest Coverage Report
        uses: davelosert/vitest-coverage-report-action@c4bbc33a89b7ace0e63d35f1f7d4bcee31155a73 # v2.13.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: packages/ui

      - name: Test the repo scripts
        if: ${{ !cancelled() }}
        run: bun test ./scripts

  # The ui unit suite at the lowest versions the peer ranges allow. Informational until it has
  # three stable runs, then it becomes required (#393).
  floors:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    # It runs code bun.lock does not pin (react-dom@19.2.0 pulls scheduler@0.27.0 from the
    # registry), so it gets no write scope
    permissions:
      contents: read
    env:
      # The lower bound of each ^range in packages/ui peerDependencies; the check step fails when
      # a range moved without this list
      PEER_FLOORS: react@19.2.0 react-dom@19.2.0 @base-ui/react@1.9.0 motion@12.0.0
      # Peers that are not floored here, with the reason; the check step fails on any other
      # peer missing from PEER_FLOORS
      EXEMPT: class-variance-authority tailwindcss
    steps:
      - name: Checkout Repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      # Restore only: the cache must never be saved after bun add put the floors on disk
      - name: Restore the bun install cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-host-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-host-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # --no-save: package.json and bun.lock stay as they are. With the isolated linker the
      # floors land under packages/ui/node_modules too, except motion: it is a devDependency of
      # packages/ui, so that link stays on the locked version. Removing it lets packages/ui
      # resolve the root floor. The next step proves what resolves.
      - name: Install the peer floors
        run: |
          bun add --no-save $PEER_FLOORS
          rm packages/ui/node_modules/motion

      - name: Check what chunks-ui resolves
        working-directory: packages/ui
        run: |
          bun -e '
            const peers = require("./package.json").peerDependencies;
            // class-variance-authority: bun.lock already holds its floor. tailwindcss: check:tailwind.
            const exempt = process.env.EXEMPT.split(" ");
            const floors = new Map(process.env.PEER_FLOORS.split(" ").map((spec) => {
              const at = spec.lastIndexOf("@");
              return [spec.slice(0, at), spec.slice(at + 1)];
            }));
            let bad = false;
            for (const name of floors.keys()) {
              if (!(name in peers)) { console.error(`${name}: in PEER_FLOORS, not a peer of chunks-ui`); bad = true; }
            }
            for (const [name, range] of Object.entries(peers)) {
              const floor = floors.get(name);
              if (floor === undefined) {
                if (exempt.includes(name)) { console.log(`${name}: exempt`); }
                else { console.error(`${name}: peer ${range} is in neither PEER_FLOORS nor EXEMPT`); bad = true; }
                continue;
              }
              const got = require(`${name}/package.json`).version;
              console.log(`${name}: resolves ${got}, peer range ${range}`);
              if (got !== floor) { console.error(`${name}: wanted ${floor}`); bad = true; }
              if (range !== `^${floor}`) { console.error(`${name}: PEER_FLOORS has ${floor}, the peer range is ${range}: move one with the other`); bad = true; }
            }
            process.exit(bad ? 1 : 0);
          '

      - name: Run the ui unit tests at the floors
        run: bun run --cwd packages/ui test
