name: Unit Tests
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
  pull-requests: write
# A newer push to the same PR cancels this run; master pushes and manual runs never share a group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
env:
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      # bun install reads package tarballs from here; a hit saves the registry downloads
      - name: Cache the bun install cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # One task at a time: the docs and ui jsdom suites slow each other down on 4 vCPUs.
      # --continue: a failing ui suite still runs the docs tests; the step still fails
      - name: Run tests and generate coverage report
        run: bun run test:unit:coverage --concurrency=1 --continue=dependencies-successful

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-report
          path: packages/ui/coverage

      - name: Vitest Coverage Report
        uses: davelosert/vitest-coverage-report-action@c4bbc33a89b7ace0e63d35f1f7d4bcee31155a73 # v2.13.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: packages/ui

      - name: Test the repo scripts
        if: ${{ !cancelled() }}
        run: bun test ./scripts
