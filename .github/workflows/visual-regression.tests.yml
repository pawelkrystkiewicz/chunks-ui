name: Visual Regression Tests
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# A newer push to the same PR cancels this run; master pushes and manual runs never share a group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  visual-regression-test:
    timeout-minutes: 60
    runs-on: ubuntu-26.04
    # Same image as the local linux/amd64 recipe; check:playwright keeps the tag equal to @playwright/test.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
    # Read by notify-slack.
    outputs:
      suites: ${{ steps.failed.outputs.suites }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the step below diffs a pull request against its merge base with the base branch
          fetch-depth: 0
          persist-credentials: false

      # The failure and master steps carry no run_full condition on purpose: a failing checkout or
      # decide step on master still names a cause for the Slack message that notify-slack posts.
      - name: Decide whether the suite runs
        id: changes
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # git pathspecs: a directory matches everything under it. bunfig.toml sets the linker, so
          # it changes what the suite installs.
          WATCH='packages/ui bun.lock package.json turbo.json bunfig.toml .github/workflows/visual-regression.tests.yml packages/typescript-config'
          run_full=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            git config --global --add safe.directory "$GITHUB_WORKSPACE"
            # shellcheck disable=SC2086 # WATCH splits into git pathspecs
            changed=$(git diff --name-only "origin/$BASE_REF...HEAD" -- $WATCH)
            if [ -n "$changed" ]; then
              echo "$changed"
            else
              run_full=false
              echo "no WATCH path changed, visual suite skipped"
            fi
          fi
          echo "run_full=$run_full" | tee -a "$GITHUB_OUTPUT"

      # setup-bun needs unzip; the image lacks it
      - name: Install unzip
        if: steps.changes.outputs.run_full == 'true'
        run: apt-get update && apt-get install -y --no-install-recommends unzip

      - name: Setup Bun
        if: steps.changes.outputs.run_full == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      # bun install cache (container HOME)
      - name: Cache the bun install cache
        if: steps.changes.outputs.run_full == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-container-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-container-

      - name: Install dependencies
        if: steps.changes.outputs.run_full == 'true'
        run: bun install --frozen-lockfile

      - name: Run Visual Regression Tests
        id: visual
        if: steps.changes.outputs.run_full == 'true'
        run: cd packages/ui && bun run test:visual

      # The image ships WebKit too. Runs when only the Chromium suite failed, so a PR sees both.
      - name: Run WebKit Smoke Tests
        id: webkit
        if: steps.changes.outputs.run_full == 'true' && (success() || (failure() && steps.visual.outcome == 'failure'))
        run: cd packages/ui && bun run test:webkit

      # The Chromium suite again in a random order, to catch a spec that leans on state an earlier
      # one left (an open popup, focus modality, the viewport). Master and manual runs only: it
      # repeats the longest step, and a PR gains nothing the master run would not show a push later.
      # The seed is the run number, printed by Vitest and named in the Slack message; reproduce with
      #   cd packages/ui && bunx vitest run --config vitest.visual.config.ts --sequence.shuffle --sequence.seed=<seed>
      - name: Run Visual Regression Tests in shuffled order
        id: shuffled
        if: (github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch') && !cancelled() && steps.visual.outcome != 'skipped'
        run: cd packages/ui && bunx vitest run --config vitest.visual.config.ts --sequence.shuffle --sequence.seed=${{ github.run_number }}

      # Vitest writes each failed screenshot's actual and diff PNGs to <root>/.vitest-attachments
      # cancelled() also keeps the diffs of a run that timed out or was cancelled mid-suite.
      - name: Upload diff screenshots on failure or cancel
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: visual-regression-diffs
          path: packages/ui/.vitest-attachments
          # The folder is hidden, and upload-artifact skips hidden files by default
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

      # Names the suites that failed for notify-slack: Chromium visual and WebKit smoke are one job.
      # timeout-minutes cancels the job, so a timeout and a manual cancel both read job.status cancelled.
      - name: Name the failed suites
        id: failed
        if: (failure() || cancelled()) && github.ref == 'refs/heads/master'
        env:
          JOB_STATUS: ${{ job.status }}
          VISUAL: ${{ steps.visual.outcome }}
          WEBKIT: ${{ steps.webkit.outcome }}
          SHUFFLED: ${{ steps.shuffled.outcome }}
        # Container jobs default to sh (dash), which rejects the array below.
        shell: bash
        run: |
          failed=()
          [ "$VISUAL" = failure ] && failed+=("Chromium visual")
          [ "$WEBKIT" = failure ] && failed+=("WebKit smoke")
          [ "$SHUFFLED" = failure ] && failed+=("Chromium visual shuffled (seed ${{ github.run_number }})")
          [ "$JOB_STATUS" = cancelled ] && failed+=("cancelled or timed out")
          # No suite step failed: a setup step did, or a later one such as the artifact upload
          [ ${#failed[@]} -gt 0 ] || failed=("setup or another step")
          joined=$(printf '%s, ' "${failed[@]}")
          echo "suites=${joined%, }" >> "$GITHUB_OUTPUT"

  # Posts to Slack when a master run fails, is cancelled or times out. A separate job because a
  # container that fails to start runs no step, and the Slack token stays out of the job that runs
  # bun install and the test code.
  notify-slack:
    needs: visual-regression-test
    if: always() && github.ref == 'refs/heads/master' && (needs.visual-regression-test.result == 'failure' || needs.visual-regression-test.result == 'cancelled')
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Notify Slack on Failure
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: "${{ secrets.SLACK_CHANNEL_ID }}"
            text: "Visual Regression Tests failed on master: ${{ needs.visual-regression-test.outputs.suites || format('job {0} before a suite was named', needs.visual-regression-test.result) }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View workflow>"
