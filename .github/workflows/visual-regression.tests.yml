name: Visual Regression Tests
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# A newer push to the same PR cancels this run; master pushes and manual runs never share a group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  visual-regression-test:
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    # Same image as the local linux/amd64 recipe; check:playwright keeps the tag equal to @playwright/test.
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f
    steps:
      - name: Checkout Repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # setup-bun needs unzip; the image lacks it
      - name: Install unzip
        run: apt-get update && apt-get install -y --no-install-recommends unzip

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Visual Regression Tests
        id: visual
        run: cd packages/ui && bun run test:visual

      # The image ships WebKit too. Runs when only the Chromium suite failed, so a PR sees both.
      - name: Run WebKit Smoke Tests
        id: webkit
        if: success() || (failure() && steps.visual.outcome == 'failure')
        run: cd packages/ui && bun run test:webkit

      # The Chromium suite again in a random order, to catch a spec that leans on state an earlier
      # one left (an open popup, focus modality, the viewport). Master and manual runs only: it
      # repeats the longest step, and a PR gains nothing the master run would not show a push later.
      # The seed is the run number, printed by Vitest and named in the Slack message; reproduce with
      #   cd packages/ui && bunx vitest run --config vitest.visual.config.ts --sequence.shuffle --sequence.seed=<seed>
      - name: Run Visual Regression Tests in shuffled order
        id: shuffled
        if: (github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch') && !cancelled() && steps.visual.outcome != 'skipped'
        run: cd packages/ui && bunx vitest run --config vitest.visual.config.ts --sequence.shuffle --sequence.seed=${{ github.run_number }}

      # Vitest writes each failed screenshot's actual and diff PNGs to <root>/.vitest-attachments
      - name: Upload diff screenshots on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: visual-regression-diffs
          path: packages/ui/.vitest-attachments
          # The folder is hidden, and upload-artifact skips hidden files by default
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

      - name: Notify Slack on Success
        if: success() && github.ref == 'refs/heads/master'
        uses: slackapi/slack-github-action@91efab103c0de0a537f72a35f6b8cda0ee76bf0a # v2.1.1
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: "${{ secrets.SLACK_CHANNEL_ID }}"
            text: "Visual Regression Tests passed on master\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View workflow>"

      # Names the suites that failed: Chromium visual and WebKit smoke are one job.
      - name: Name the failed suites
        id: failed
        if: failure() && github.ref == 'refs/heads/master'
        env:
          VISUAL: ${{ steps.visual.outcome }}
          WEBKIT: ${{ steps.webkit.outcome }}
          SHUFFLED: ${{ steps.shuffled.outcome }}
        run: |
          failed=""
          [ "$VISUAL" = failure ] && failed="$failed Chromium visual,"
          [ "$WEBKIT" = failure ] && failed="$failed WebKit smoke,"
          [ "$SHUFFLED" = failure ] && failed="$failed Chromium visual shuffled (seed ${{ github.run_number }}),"
          # No suite failed: the install or setup did
          [ -n "$failed" ] || failed=" setup (checkout, bun, install),"
          echo "suites=${failed# }" | sed 's/,$//' >> "$GITHUB_OUTPUT"

      - name: Notify Slack on Failure
        if: failure() && github.ref == 'refs/heads/master'
        uses: slackapi/slack-github-action@91efab103c0de0a537f72a35f6b8cda0ee76bf0a # v2.1.1
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: "${{ secrets.SLACK_CHANNEL_ID }}"
            text: "Visual Regression Tests failed on master: ${{ steps.failed.outputs.suites }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View workflow>"
